# ============================================================
# 仓库配置模板
# 复制此文件到 ~/.hermes/code-study/repos/{name}.yaml 并填写
# ============================================================

# ===== 标识与路径 =====
name: ""                              # 仓库简称，用于文件命名
git_url: ""                           # 远程 git 地址（可选，用于参考）
local_path: ""                        # 本地绝对路径

# ===== 推送 =====
feishu_chat_id: ""                    # 排查笔记推送目标飞书群
schedule: "0 8 * * *"                 # cron 表达式，控制每日阅读时间
enabled: true                         # false 可暂停此仓库的阅读

# ===== 阅读引导 =====
# 留空则使用 defaults.yaml 的全局 custom_prompt
# custom_prompt: |
#   本仓库专属关注点...

# ===== 范围控制 =====
exclude_paths:                        # 扫描时跳过的目录
  - "tests/"
  # - "docs/"
  # - "frontend/"

# ===== 问题与进度 =====
# 首次使用时 questions 可以为空，AI 会结合用户可见行为生成建议问题
# 确认后写入此列表
questions: []
  # - q: "用户敲下 XX 命令后，底层一步步发生了什么？"
  #   status: pending                # pending → done
  #   answer_log:
  #     - date: "2026-08-12"
  #       note: "notes/xxx/2026-08-12-问题简述.md"
  #       summary: "一句话摘要"
