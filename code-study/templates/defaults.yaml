# ============================================================
# 全局默认配置 — 所有仓库的基础 custom_prompt 和输出格式
# 仓库级 YAML 中的 custom_prompt 会覆盖此文件的内容
# ============================================================

custom_prompt: |
  以问题为驱动阅读 {name} 源码。对每个问题，从用户可见行为（CLI 命令、API 调用、事件触发）出发，
  追踪源码调用链直到核心逻辑。输出格式：

  ## 问题
  {问题原文}

  ## 调用链（Step 0 → Step N）
  每步标注：做什么 + 源码文件:行号

  ## 关键发现
  3 个核心洞察（设计决策/架构模式/为什么这样做）

  ## 追踪要点
  - 从入口函数开始，不要跳到结论——每一步都要有真实的源码文件:行号佐证
  - 关注关键分支和默认路径，标注哪些是主干、哪些是边界
  - 关键发现要回答「为什么这么设计」，而不是复述「代码做了什么」
